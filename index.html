<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4258c4" />
    <meta name="description" content="Mausi Blast – Block-Puzzle ohne Werbung." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mausi Blast" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Mausi Blast</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="best" title="Best">
          <svg viewBox="2 4 20 15" aria-hidden="true"><path d="M3 18h18l-1.5-10-4.5 4-3-7-3 7-4.5-4z" /><circle cx="3.6" cy="7.4" r="1.4" /><circle cx="12" cy="4.6" r="1.4" /><circle cx="20.4" cy="7.4" r="1.4" /></svg>
          <span id="best">0</span>
          <span id="mode-badge" class="mode-badge">Standard</span>
        </div>
        <button id="btn-settings" class="icon-btn" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </header>

      <div class="score-wrap">
        <div id="score-gem" class="score-gem"></div>
        <div id="score" class="score">0</div>
        <div id="combo-meter" class="combo-meter hidden" aria-live="polite">
          <span id="combo-meter-text">Combo ×2</span>
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
      </div>

      <main id="board-wrap" class="board-wrap">
        <div id="board" class="board"></div>
        <div id="fx" class="fx"></div>
      </main>

      <div id="tray" class="tray">
        <div id="no-space" class="no-space hidden">No Space Left</div>
      </div>
    </div>

    <div id="fx-global"></div>

    <div id="overlay-gameover" class="overlay hidden">
      <div class="panel">
        <h2>Game Over</h2>
        <div id="go-mode" class="label">Standard</div>
        <div class="label">Score</div>
        <div id="go-score" class="go-score">0</div>
        <div id="go-record" class="go-record hidden">New Best!</div>
        <div class="go-best">Best: <span id="go-best">0</span></div>
        <div class="go-stats">Best Combo: <span id="go-best-combo">0</span> · All Clears: <span id="go-all-clears">0</span></div>
        <button id="btn-restart" class="btn primary">Play Again</button>
      </div>
    </div>

    <div id="overlay-settings" class="overlay hidden">
      <div class="panel">
        <h2>Menu</h2>
        <div class="mode-row">
          <span>Mode</span>
          <div class="mode-switch" id="mode-switch">
            <button data-mode="standard">Standard</button>
            <button data-mode="hard">Hard</button>
          </div>
        </div>
        <p id="mode-hint" class="mode-hint hidden">Tap again to start a new game in this mode.</p>
        <label class="toggle"><span>Sound</span><input type="checkbox" id="opt-sound" /><i></i></label>
        <label class="toggle"><span>Vibration</span><input type="checkbox" id="opt-haptics" /><i></i></label>
        <div class="skin-row">
          <span>Skin Album</span>
          <div class="skins" id="skins"></div>
          <button id="btn-photo" class="link-btn hidden">Choose another photo</button>
          <input id="photo-input" type="file" accept="image/*" hidden />
        </div>
        <label class="toggle small"><span>New skin on „All Clear!“</span><input type="checkbox" id="opt-skin-cycle" /><i></i></label>
        <button id="btn-newgame" class="btn">New Game</button>
        <button id="btn-close-settings" class="btn primary">Resume</button>
        <p class="hint">Tipp: Im Browser „Zum Home-Bildschirm“ wählen – dann startet Mausi Blast wie eine App, auch offline.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
